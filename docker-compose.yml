services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: yuvo_timescaledb
    environment:
      POSTGRES_USER: yuvo
      POSTGRES_PASSWORD: yuvo_pass
      POSTGRES_DB: yuvo_gps
    ports:
      - "5432:5432"
    volumes:
      - yuvo_timescale_data:/var/lib/postgresql/data
      - ./infra/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  yuvo_timescale_data:
